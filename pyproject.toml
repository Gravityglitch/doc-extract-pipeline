[project]
name = "doc-extract-pipeline"
version = "0.1.0"
description = "LLM document pipeline: inbox PDFs/emails -> extraction -> validation -> reconciliation -> daily briefing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "fpdf2>=2.8.9",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
docpipe = "docpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-per-file-ignores = { "src/docpipe/cli.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
