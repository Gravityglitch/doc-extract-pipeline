[project]
name = "doc-extract-pipeline"
version = "0.1.0"
description = "LLM document pipeline: inbox PDFs/emails -> extraction -> validation -> reconciliation -> daily briefing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.12.1",
    "fastapi>=0.115",
    "fpdf2>=2.8.9",
    "psycopg[binary]>=3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
    "structlog>=24",
    "tenacity>=8.2",
    "typer>=0.27.3",
    "uvicorn>=0.30",
]

[project.scripts]
docpipe = "docpipe.cli:app"

[project.optional-dependencies]
sheets = [
    "gspread>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-per-file-ignores = { "src/docpipe/cli.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/docpipe"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
